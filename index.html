<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rafi's Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#E8453C;--accent-h:#d63830;--accent-l:rgba(232,69,60,.12);--bg:#f5f3ee;--bg2:#eceae4;--card:#fff;--border:#e2dfd6;--text:#1c1917;--text2:#57534e;--text3:#a8a29e;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.12)}
[data-theme="dark"]{--bg:#09090b;--bg2:#111113;--card:#18181b;--border:#27272a;--text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 8px 30px rgba(0,0,0,.5)}
[data-theme="pink"]{--accent:#C2255C;--accent-h:#9D174D;--accent-l:rgba(194,37,92,.12);--bg:#fdf2f7;--bg2:#fce4ef;--card:#fffbfd;--border:#f6c9de;--text:#4a1030;--text2:#8a4a68;--text3:#c48aa8;--shadow:0 1px 3px rgba(219,39,119,.10);--shadow-lg:0 8px 30px rgba(219,39,119,.18)}
[data-theme="blue"]{--accent:#2563EB;--accent-h:#1D4ED8;--accent-l:rgba(37,99,235,.12);--bg:#eff6fc;--bg2:#e0edf9;--card:#fafcfe;--border:#bfdcf2;--text:#0c2d4a;--text2:#3f6a8a;--text3:#7fa8c4;--shadow:0 1px 3px rgba(37,99,235,.10);--shadow-lg:0 8px 30px rgba(37,99,235,.18)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
.container{max-width:1200px;margin:0 auto;padding:24px 16px}
h1{font-size:28px;font-weight:800;margin-bottom:4px}.sub{color:var(--text3);font-size:14px;margin-bottom:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.toolbar input,.toolbar select,.filter-panel select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px;font-size:13px;font-family:inherit;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input{flex:1;min-width:180px}
.filter-panel select{min-width:130px;cursor:pointer}
.ms-genre{position:relative;min-width:130px}
.ms-genre-btn{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ms-genre-btn:hover{border-color:var(--accent)}
.ms-genre-btn.has-active{border-color:var(--accent);color:var(--accent)}
.ms-genre-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-genre-btn i{font-size:10px;color:var(--text3);flex-shrink:0}
.ms-genre-panel{position:absolute;top:calc(100% + 4px);left:0;min-width:220px;max-height:260px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;padding:6px}
.ms-genre-panel.hidden{display:none}
.ms-genre-option{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--text);user-select:none}
.ms-genre-option:hover{background:var(--bg2)}
.ms-genre-option input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.ms-genre-empty{padding:10px 8px;font-size:12px;color:var(--text3);text-align:center}
.ms-genre-clear{display:block;width:100%;text-align:center;background:none;border:none;border-top:1px solid var(--border);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:8px 6px 4px;margin-top:4px}
.ms-genre-clear:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card .pw{width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--bg2)}
.card .pw img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.card:hover .pw img{transform:scale(1.05)}
.card .st{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase}
.card .fav{position:absolute;bottom:8px;left:8px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);border-radius:7px;color:#fbbf24;font-size:12px}
.tbl-fav{color:#fbbf24;margin-right:6px;font-size:12px}
.card .info{padding:10px}.card .info .t{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info .m{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-bottom:5px}
.card .info .g{display:flex;flex-wrap:wrap;gap:4px}
.card .info .gt{padding:2px 6px;border-radius:5px;font-size:10px;font-weight:600;background:var(--bg2);color:var(--text2)}
.modal .g{display:flex;flex-wrap:wrap;gap:6px}
.modal .gt{display:inline-flex;padding:4px 10px;border-radius:8px;background:var(--accent-l);color:var(--accent);font-size:12px;font-weight:600}
.modal .st{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase}
.rb{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;border-radius:5px;font-size:11px;font-weight:800;color:#fff;padding:0 5px}
.r1,.r2,.r3{background:#EF4444}.r4,.r5{background:#F97316}.r6{background:#EAB308}.r7{background:#84CC16;color:#1c1917}.r8,.r9{background:#22C55E}.r10{background:rgba(59,130,246,.85)}.rnone{background:var(--bg2);color:var(--text3);border:1px solid var(--border)}
.sw{background:rgba(59,130,246,.85);color:#fff}.sc{background:rgba(34,197,94,.85);color:#fff}.sp{background:rgba(168,162,158,.85);color:#fff}.so{background:rgba(249,115,22,.85);color:#fff}.sd{background:rgba(239,68,68,.85);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg.hidden{display:none}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:750px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:24px}
.modal h2{font-size:20px;font-weight:800;margin-bottom:4px}.modal .sub2{font-size:13px;color:var(--text3);margin-bottom:16px}
.modal .row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}.modal .row .l{color:var(--text3);min-width:100px;font-weight:600}
.modal .review{margin-top:12px;padding:14px;background:var(--bg2);border-radius:10px;font-size:13px;line-height:1.7;color:var(--text2)}
.related-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.related-section h4{font-size:13px;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
.related-group{margin-bottom:10px}
.related-group .rel-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
.related-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;transition:background .15s}
.related-card:hover{background:var(--bg2)}
.related-card img{width:32px;height:44px;object-fit:cover;border-radius:5px;flex-shrink:0}
.related-card span{font-size:13px;color:var(--text)}
.modal .close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}.empty i{font-size:40px;margin-bottom:12px;opacity:.4}
#theme-btn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:18px;z-index:40;box-shadow:var(--shadow-lg)}
#theme-menu{position:fixed;bottom:72px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:41;min-width:170px}
#theme-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;border:none;background:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;text-align:left}
#theme-menu button:hover{background:var(--bg2);color:var(--text)}
#theme-menu button.active{background:var(--accent-l);color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stat .v{font-size:24px;font-weight:800}.stat .l{font-size:12px;color:var(--text3);margin-top:2px}
.hidden{display:none!important}
.filter-panel{display:flex;flex-wrap:wrap;gap:10px;max-height:0;opacity:0;overflow:hidden;margin-bottom:0;transition:max-height .25s ease,opacity .2s ease,margin-bottom .25s ease}
.filter-panel.expanded{max-height:500px;opacity:1;margin-bottom:20px}
#filter-toggle-btn{position:relative}
#filter-toggle-btn.has-active{border-color:var(--accent);color:var(--accent)}
.filter-count-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:2px}
@media(min-width:769px){
  #filter-toggle-btn{display:none}
  .filter-panel{max-height:none!important;opacity:1!important;overflow:visible!important;margin-bottom:20px!important;transition:none}
}
.view-toggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px}
.view-toggle button{border:none;background:none;color:var(--text3);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:14px}
.view-toggle button.active{background:var(--accent);color:#fff}
.btn{padding:10px 22px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.btn-secondary{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
#ffav.active{background:#fbbf24;color:#1a1a1a;border-color:#fbbf24}
.tbl-wrap{overflow-x:auto}
table.atbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13px}
table.atbl th{text-align:left;padding:10px 12px;background:var(--bg2);color:var(--text3);font-size:11px;text-transform:uppercase;font-weight:700;white-space:nowrap}
table.atbl td{padding:8px 12px;border-top:1px solid var(--border);white-space:nowrap}
table.atbl tr{cursor:pointer}table.atbl tr:hover td{background:var(--bg2)}
table.atbl img{width:34px;height:46px;object-fit:cover;border-radius:5px;display:block}
.scroll-fab{position:fixed;bottom:20px;left:20px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:18px;cursor:pointer;z-index:40;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s,transform .15s}
.scroll-fab:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-3px)}
.scroll-fab:active{transform:translateY(0) scale(.93)}
#scroll-top-fab{bottom:76px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.toolbar{flex-direction:column}.toolbar input,.toolbar select,.filter-panel{width:100%}.filter-panel{flex-direction:column}.filter-panel select{width:100%}.ms-genre{width:100%}.ms-genre-panel{left:0;right:0;min-width:0}#filter-toggle-btn,#ffav{width:100%;justify-content:center}}

</head>
<body>
<div class="container">
<h1><i class="fas fa-play-circle" style="color:var(--accent);margin-right:8px"></i>Rafi's Collection</h1>
<p class="sub" id="sub"></p>
<div class="stats" id="stats"></div>
<div class="toolbar">
<input type="text" id="search" placeholder="Cari judul, studio, genre..." oninput="render()">
<select id="fstatus" onchange="render()"><option value="">Semua Status</option></select>
<button class="btn btn-secondary" id="ffav" type="button" onclick="toggleFavFilter()"><i class="fas fa-star"></i> Favorit</button>
<button class="btn btn-secondary" id="filter-toggle-btn" type="button" onclick="document.getElementById('filter-panel').classList.toggle('expanded')"><i class="fas fa-sliders-h"></i> Filter &amp; Urutkan <span id="filter-count-badge" class="filter-count-badge hidden">0</span></button>
<div class="view-toggle">
<button id="bgrid" class="active" onclick="setView('grid')" title="Grid"><i class="fas fa-th-large"></i></button>
<button id="btbl" onclick="setView('table')" title="Tabel"><i class="fas fa-list"></i></button>
</div>
</div>
<div class="filter-panel" id="filter-panel">
<select id="ftype" onchange="render()"><option value="">Semua Tipe</option></select>
<select id="fseason" onchange="render()"><option value="">Semua Musim</option></select>
<select id="fyear" onchange="render()"><option value="">Semua Tahun</option></select>
<div class="ms-genre" id="genre-filter-wrap">
<button type="button" id="genre-filter-btn" class="ms-genre-btn"><span id="genre-filter-label">Semua Genre</span><i class="fas fa-chevron-down"></i></button>
<div class="ms-genre-panel hidden" id="genre-filter-panel"></div>
</div>
<select id="frating" onchange="onRatingChange()"><option value="">Semua Rating</option><option value="rating-desc">Rating Tertinggi</option><option value="rating-asc">Rating Terendah</option><option value="10">10</option><option value="9.5">9.5</option><option value="9">9</option><option value="8.5">8.5</option><option value="8">8</option><option value="7.5">7.5</option><option value="7">7</option><option value="6.5">6.5</option><option value="6">6</option><option value="5.5">5.5</option><option value="5">5</option><option value="4.5">4.5</option><option value="4">4</option><option value="3.5">3.5</option><option value="3">3</option><option value="2.5">2.5</option><option value="2">2</option><option value="1.5">1.5</option><option value="1">1</option></select>
<select id="stitle" onchange="onTitleSortChange()"><option value="">Urutkan Judul</option><option value="titleEn-asc">Judul A-Z</option><option value="titleEn-desc">Judul Z-A</option></select>
</div>
<div class="grid" id="grid"></div>
<div class="tbl-wrap hidden" id="tblwrap"></div>
<div class="empty" id="empty" style="display:none"><i class="fas fa-film"></i><p>Tidak ada anime yang cocok</p></div>
</div>
<div class="modal-bg hidden" id="modal" onclick="if(event.target===this)this.classList.add('hidden')">
<div class="modal" style="position:relative" id="modal-body"></div>
</div>
<div id="theme-area">
<div id="theme-menu" class="hidden">
<button type="button" data-theme-choice="dark"><i class="fas fa-moon"></i> Mode Gelap</button>
<button type="button" data-theme-choice="light"><i class="fas fa-sun"></i> Mode Terang</button>
<button type="button" data-theme-choice="pink"><i class="fas fa-heart"></i> Mode Pink</button>
<button type="button" data-theme-choice="blue"><i class="fas fa-droplet"></i> Mode Biru</button>
</div>
<button id="theme-btn"><i class="fas fa-moon"></i></button>
</div>
<button id="scroll-bottom-fab" class="scroll-fab hidden" type="button" onclick="scrollToBottomSmooth()" title="Gulir ke bawah koleksi" aria-label="Gulir ke bawah koleksi"><i class="fas fa-angles-down"></i></button>
<button id="scroll-top-fab" class="scroll-fab hidden" type="button" onclick="scrollToTopSmooth()" title="Gulir ke atas koleksi" aria-label="Gulir ke atas koleksi"><i class="fas fa-angles-up"></i></button>

function fp(a){const sm={winter:'Winter',spring:'Spring',summer:'Summer',fall:'Fall'};const sl=a.premieredSeason?(sm[a.premieredSeason]||a.premieredSeason):'';if(sl&&a.premieredYear)return sl+' '+a.premieredYear;if(sl)return sl;if(a.premieredYear)return String(a.premieredYear);return'-'}
function gr(id){const a=DATA.find(x=>x.id===id);if(!a)return[];const out=[];(a.relations||[]).forEach(r=>{const t=DATA.find(x=>x.id===r.targetId);if(t)out.push({type:r.type,anime:t})});DATA.forEach(x=>{if(x.id===id)return;(x.relations||[]).forEach(r=>{if(r.targetId===id)out.push({type:RI[r.type]||r.type,anime:x})})});return out}
function ph(){return"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" fill="%2327272a"><rect width="300" height="400"/><text x="150" y="200" text-anchor="middle" fill="%2371717a" font-family="sans-serif" font-size="14">No Poster</text></svg>')}
function onRatingChange(){const v=document.getElementById('frating').value;if(v==='rating-desc'||v==='rating-asc')document.getElementById('stitle').value='';render()}
function onTitleSortChange(){if(document.getElementById('stitle').value){const fr=document.getElementById('frating');if(fr.value==='rating-desc'||fr.value==='rating-asc')fr.value=''}render()}
function setView(v){curView=v;document.getElementById('bgrid').classList.toggle('active',v==='grid');document.getElementById('btbl').classList.toggle('active',v==='table');document.getElementById('grid').classList.toggle('hidden',v!=='grid');document.getElementById('tblwrap').classList.toggle('hidden',v!=='table');render()}
function filtered(){
  let d=[...DATA];const s=document.getElementById('search').value.toLowerCase();
  const fs=document.getElementById('fstatus').value,ft=document.getElementById('ftype').value;
  const fse=document.getElementById('fseason').value,fy=document.getElementById('fyear').value;
  const frRaw=document.getElementById('frating').value;const isRSort=frRaw==='rating-desc'||frRaw==='rating-asc';const fr=isRSort?'':frRaw;
  const ts=document.getElementById('stitle').value;
  if(s)d=d.filter(a=>(a.titleEn||'').toLowerCase().includes(s)||(a.titleJp||'').toLowerCase().includes(s)||(a.studio||'').toLowerCase().includes(s)||(a.genres||[]).some(g=>g.toLowerCase().includes(s)));
  if(fs)d=d.filter(a=>a.status===fs);if(ft)d=d.filter(a=>a.type===ft);
  if(fse)d=d.filter(a=>a.premieredSeason===fse);if(fy)d=d.filter(a=>String(a.premieredYear||'')===fy);
  if(selGenres.length)d=d.filter(a=>selGenres.every(g=>(a.genres||[]).includes(g)));if(fr)d=d.filter(a=>parseFloat(a.rating)===parseFloat(fr));
  if(favFilter)d=d.filter(a=>a.favorite);
  let f,dir;const so={winter:0,spring:1,summer:2,fall:3};
  if(ts){[f,dir]=ts.split('-')}else if(isRSort){f='rating';dir=frRaw==='rating-desc'?'desc':'asc'}else{f='order';dir='asc'}
  d.sort((a,b)=>{let va,vb;if(f==='rating'){va=parseFloat(a.rating)||0;vb=parseFloat(b.rating)||0}else if(f==='premiered'){va=(a.premieredYear||0)*10+(so[a.premieredSeason]??0);vb=(b.premieredYear||0)*10+(so[b.premieredSeason]??0)}else if(f==='order'){va=typeof a.order==='number'?a.order:Number.MAX_SAFE_INTEGER;vb=typeof b.order==='number'?b.order:Number.MAX_SAFE_INTEGER}else{va=(a[f]||'').toLowerCase();vb=(b[f]||'').toLowerCase()}return va<vb?(dir==='asc'?-1:1):va>vb?(dir==='asc'?1:-1):0});
  return d}
function renderTable(d){
  document.getElementById('tblwrap').innerHTML='<table class="atbl"><thead><tr><th></th><th>Judul</th><th>Tipe</th><th>Premiered</th><th>Episode</th><th>Studio</th><th>Rating</th><th>Status</th></tr></thead><tbody>'+d.map(a=>{const t=a.titleEn||a.titleJp||'?';const fav=a.favorite?'<i class="fas fa-star tbl-fav"></i>':'';return`<tr onclick="show('${a.id}')"><td><img src="${a.poster||ph()}" onerror="this.src=ph()" loading="lazy"></td><td>${fav}${esc(t)}</td><td>${a.type||'-'}</td><td>${fp(a)}</td><td>${a.episodes||'-'}</td><td>${esc(a.studio||'-')}</td><td><span class="rb ${rc(a.rating||0)}">${a.rating||'?'}</span></td><td><span class="st ${SC[a.status]||''}" style="position:static">${SM[a.status]||'-'}</span></td></tr>`}).join('')+'</tbody></table>'}
function updateFilterBadge(){
  const btn=document.getElementById('filter-toggle-btn'),badge=document.getElementById('filter-count-badge');
  const frRaw=document.getElementById('frating').value;const isRatingFilterValue=frRaw&&frRaw!=='rating-desc'&&frRaw!=='rating-asc';
  let count=0;
  if(document.getElementById('ftype').value)count++;
  if(document.getElementById('fseason').value)count++;
  if(document.getElementById('fyear').value)count++;
  if(selGenres.length)count++;
  if(isRatingFilterValue)count++;
  if(count>0){badge.textContent=count;badge.classList.remove('hidden');btn.classList.add('has-active')}
  else{badge.classList.add('hidden');btn.classList.remove('has-active')}
}
let selGenres=[];
function populateGenrePanel(allGenres){
  selGenres=selGenres.filter(g=>allGenres.includes(g));
  const panel=document.getElementById('genre-filter-panel');
  if(!allGenres.length){panel.innerHTML='<div class="ms-genre-empty">Belum ada genre</div>'}
  else{panel.innerHTML=allGenres.map(g=>'<label class="ms-genre-option"><input type="checkbox" value="'+esc(g)+'" '+(selGenres.includes(g)?'checked':'')+'><span>'+esc(g)+'</span></label>').join('')+(selGenres.length?'<button type="button" class="ms-genre-clear" id="genre-filter-clear">Hapus Semua</button>':'')}
  updateGenreFilterLabel();
}
function updateGenreFilterLabel(){
  const btn=document.getElementById('genre-filter-btn'),label=document.getElementById('genre-filter-label');
  if(!selGenres.length){label.textContent='Semua Genre';btn.classList.remove('has-active')}
  else if(selGenres.length===1){label.textContent=selGenres[0];btn.classList.add('has-active')}
  else{label.textContent=selGenres.length+' Genre Dipilih';btn.classList.add('has-active')}
}
function toggleGenreFilter(value,checked){
  if(checked){if(!selGenres.includes(value))selGenres.push(value)}else{selGenres=selGenres.filter(g=>g!==value)}
  updateGenreFilterLabel();render();
}
function render(){
  updateFilterBadge();
  const d=filtered(),e=document.getElementById('empty');
  if(!d.length){document.getElementById('grid').innerHTML='';document.getElementById('tblwrap').innerHTML='';e.style.display='';updateScrollFabVisibility();return}e.style.display='none';
  if(curView==='table'){renderTable(d);updateScrollFabVisibility();return}
  document.getElementById('grid').innerHTML=d.map(a=>{const t=a.titleEn||a.titleJp||'?';const gs=(a.genres||[]).slice(0,3);const fav=a.favorite?'<span class="fav"><i class="fas fa-star"></i></span>':'';return`<div class="card" onclick="show('${a.id}')"><div class="pw" style="position:relative"><img src="${a.poster||ph()}" onerror="this.src=ph()" loading="lazy"><span class="st ${SC[a.status]||''}">${SM[a.status]||'?'}</span>${fav}</div><div class="info"><div class="t">${esc(t)}</div><div class="m"><span class="rb ${rc(a.rating||0)}">${a.rating||'?'}</span><span>${a.type||'?'}</span><span>${a.episodes?a.episodes+' eps':'?'}</span></div><div class="g">${gs.map(g=>'<span class="gt">'+esc(g)+'</span>').join('')}</div></div></div>`}).join('');updateScrollFabVisibility()}
function smoothScrollTo(y,cb){const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);const ty=Math.max(0,Math.min(y,maxY));const sy=window.scrollY||window.pageYOffset;const dist=ty-sy;const rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;if(rm||Math.abs(dist)<1){window.scrollTo(0,ty);if(cb)cb();return}const dur=Math.min(300+Math.abs(dist)*0.3,1000);const t0=performance.now();function step(now){const t=Math.min((now-t0)/dur,1);const e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;window.scrollTo(0,sy+dist*e);if(t<1)requestAnimationFrame(step);else if(cb)cb()}requestAnimationFrame(step)}
function scrollToBottomSmooth(cb){smoothScrollTo(document.documentElement.scrollHeight,cb)}
function scrollToTopSmooth(cb){smoothScrollTo(0,cb)}
function updateScrollFabVisibility(){
  const fb=document.getElementById('scroll-bottom-fab'),ft=document.getElementById('scroll-top-fab');
  if(!fb&&!ft)return;
  const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  const sy=window.scrollY||window.pageYOffset;
  const canScroll=maxY>200;
  if(fb)fb.classList.toggle('hidden',!canScroll||sy>=maxY-150);
  if(ft)ft.classList.toggle('hidden',!canScroll||sy<=150);
}
function show(id){
  const a=DATA.find(x=>x.id===id);if(!a)return;const m=document.getElementById('modal-body');
  const rel=gr(id);const order=['sequel','prequel','side_story','spin_off','parent_story','summary','full_story'];
  const relHtml=rel.length?'<div class="related-section"><h4>Anime Terkait</h4>'+order.filter(t=>rel.some(r=>r.type===t)).map(t=>'<div class="related-group"><div class="rel-label">'+RL[t]+'</div>'+rel.filter(r=>r.type===t).map(r=>'<div class="related-card" onclick="show(\''+r.anime.id+'\')"><img src="'+(r.anime.poster||ph())+'" onerror="this.src=ph()"><span>'+esc(r.anime.titleEn||r.anime.titleJp||'?')+'</span></div>').join('')+'</div>').join('')+'</div>':'';
  m.innerHTML=`<button class="close" onclick="document.getElementById('modal').classList.add('hidden')">&times;</button><div style="display:flex;gap:20px;flex-wrap:wrap"><div style="width:180px;flex-shrink:0"><img src="${a.poster||ph()}" onerror="this.src=ph()" style="width:100%;border-radius:12px;aspect-ratio:3/4;object-fit:cover"></div><div style="flex:1;min-width:200px"><h2>${a.favorite?'<i class="fas fa-star" style="color:#fbbf24;margin-right:8px;font-size:.8em"></i>':''}${esc(a.titleEn||a.titleJp||'?')}</h2><div class="sub2">${esc(a.titleJp||'')}</div><div class="row"><span class="l">Tipe</span><span>${a.type||'-'}</span></div><div class="row"><span class="l">Episode</span><span>${a.episodes||'-'}</span></div><div class="row"><span class="l">Studio</span><span>${esc(a.studio||'-')}</span></div><div class="row"><span class="l">Rating</span><span class="rb ${rc(a.rating||0)}">${a.rating||'-'}/10</span></div><div class="row"><span class="l">Status</span><span class="st ${SC[a.status]||''}" style="position:static">${SM[a.status]||'-'}</span></div><div class="row"><span class="l">Premiered</span><span>${fp(a)}</span></div><div class="row"><span class="l">Genre</span><div class="g">${(a.genres||[]).map(g=>'<span class="gt">'+esc(g)+'</span>').join('')}</div></div>${a.review?'<div class="review"><strong>Review:</strong><br>'+esc(a.review)+'</div>':''}${relHtml}</div></div>`;
  document.getElementById('modal').classList.remove('hidden')}
const THEME_META={dark:{icon:'moon',label:'Mode Gelap'},light:{icon:'sun',label:'Mode Terang'},pink:{icon:'heart',label:'Mode Pink'},blue:{icon:'droplet',label:'Mode Biru'}};
function initTheme(){
  const saved=localStorage.getItem('ak_theme');
  const theme=THEME_META[saved]?saved:'dark';
  document.documentElement.setAttribute('data-theme',theme);
  updateThemeBtn(theme);
}
function setTheme(theme){
  if(!THEME_META[theme])return;
  document.documentElement.setAttribute('data-theme',theme);
  localStorage.setItem('ak_theme',theme);
  updateThemeBtn(theme);
  closeThemeMenu();
}
function toggleThemeMenu(){document.getElementById('theme-menu').classList.toggle('hidden')}
function closeThemeMenu(){document.getElementById('theme-menu').classList.add('hidden')}
function updateThemeBtn(theme){
  const meta=THEME_META[theme]||THEME_META.dark;
  document.getElementById('theme-btn').innerHTML='<i class="fas fa-'+meta.icon+'"></i>';
  document.querySelectorAll('#theme-menu button[data-theme-choice]').forEach(b=>{
    b.classList.toggle('active',b.dataset.themeChoice===theme);
  });
}
(function init(){
  initTheme();
  document.getElementById('sub').textContent=DATA.length+' anime dalam koleksi';
  const te=DATA.reduce((s,a)=>s+(parseInt(a.episodes)||0),0);
  const rated=DATA.filter(a=>(parseFloat(a.rating)||0)>0);
  const ar=rated.length?(rated.reduce((s,a)=>s+parseFloat(a.rating),0)/rated.length).toFixed(1):'0';
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="v">${DATA.length}</div><div class="l">Total Anime</div></div><div class="stat"><div class="v">${te}</div><div class="l">Total Episode</div></div><div class="stat"><div class="v">${ar}</div><div class="l">Rata-rata Rating</div></div>`;
  const fs=document.getElementById('fstatus');Object.entries(SM).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;fs.appendChild(o)});
  const ft=document.getElementById('ftype');['TV','Movie','OVA','ONA','Special'].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;ft.appendChild(o)});
  const fse=document.getElementById('fseason');[['winter','Winter'],['spring','Spring'],['summer','Summer'],['fall','Fall']].forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;fse.appendChild(o)});
  const years=[...new Set(DATA.filter(a=>a.premieredYear).map(a=>a.premieredYear))].sort((a,b)=>b-a);
  const fy=document.getElementById('fyear');years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;fy.appendChild(o)});
  const genres=[...new Set(DATA.flatMap(a=>a.genres||[]))].sort();
  populateGenrePanel(genres);
  document.getElementById('genre-filter-btn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('genre-filter-panel').classList.toggle('hidden')});
  document.getElementById('genre-filter-panel').addEventListener('click',e=>{
    e.stopPropagation();
    if(e.target.id==='genre-filter-clear'){selGenres=[];populateGenrePanel(genres);render();return}
    if(e.target.matches('input[type="checkbox"]'))toggleGenreFilter(e.target.value,e.target.checked);
  });
  document.addEventListener('click',e=>{
    const wrap=document.getElementById('genre-filter-wrap');
    if(wrap&&!wrap.contains(e.target))document.getElementById('genre-filter-panel').classList.add('hidden');
  });
  document.getElementById('theme-btn').addEventListener('click',e=>{e.stopPropagation();toggleThemeMenu()});
  document.getElementById('theme-menu').addEventListener('click',e=>{
    e.stopPropagation();
    const btn=e.target.closest('button[data-theme-choice]');
    if(btn)setTheme(btn.dataset.themeChoice);
  });
  document.addEventListener('click',e=>{
    const wrap=document.getElementById('theme-area');
    if(wrap&&!wrap.contains(e.target))closeThemeMenu();
  });
  window.addEventListener('resize',updateScrollFabVisibility);
  let scrollFabTicking=false;
  window.addEventListener('scroll',()=>{if(scrollFabTicking)return;scrollFabTicking=true;requestAnimationFrame(()=>{updateScrollFabVisibility();scrollFabTicking=false})},{passive:true});
  render()})();
</script>
